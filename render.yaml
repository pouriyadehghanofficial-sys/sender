services:
  - type: web
    name: bale-broadcast-ai
    env: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build && cd web && npm install && npm run build && cd ..
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: ADMIN_NOTIFY_METHOD
        value: bale
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_PANEL_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
